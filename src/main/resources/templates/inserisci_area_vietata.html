<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inserimento Area Vietata - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container {
            max-width: 750px;
            margin: 2.5rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            color: #0f5132;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn-danger-sm {
            background-color: #dc3545;
            color: white;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .data-table th, .data-table td {
            padding: 0.6rem;
            border-bottom: 1px solid #dee2e6;
            text-align: left;
        }
        .data-table th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        .badge-vietata {
            background: #dc3545;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body style="display: block;">
<div th:replace="~{header :: appHeader}"></div>

<div class="form-container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0; color: #2c3e50;">🚫 Configura Nuova Zona Vietata</h2>
        <a th:href="@{/amministrazione/aree-vietate/annulla}" class="btn-danger-sm">✖ Annulla</a>
    </div>

    <!-- Messaggio di conferma -->
    <div th:if="${messaggio}" class="alert-success" th:text="${messaggio}">
        Salvataggio completato con successo
    </div>

    <!-- Gestione Errore Validazione -->
    <div th:if="${erroreValidazione}" class="alert-error">
        <strong>⚠️ Errore:</strong> <span th:text="${erroreValidazione}">Dati geografici non validi</span>
        <p style="font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">Modifica i dati geografici inseriti o annulla l'operazione.</p>
    </div>

    <!-- Form Inserimento -->
    <form th:action="@{/amministrazione/aree-vietate}" method="post">

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Nome/Identificativo Zona:</label>
            <input type="text" name="nomeArea" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${nomeAreaInserito}" placeholder="Es. Area Pedonale Corso Cavour" />
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Coordinate Geografiche Delimitate:</label>
            <textarea name="coordinate" class="form-control" rows="3" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" placeholder="Es. Poligono: [(41.125, 16.870), (41.126, 16.872), (41.123, 16.875)]" required th:text="${coordinateInserite}"></textarea>
        </div>

        <button type="submit" class="btn btn-danger" style="width: 100%; font-weight: bold; padding: 0.7rem; font-size: 0.95rem; background-color: #dc3545; border: none; border-radius: 6px; color: white;">
            Salva ed Imposta Zona come VIETATA
        </button>
    </form>

    <!-- Tabella elenco zone vietate salvate -->
    <div style="margin-top: 2.5rem;" th:if="${listaAreeVietate != null and !listaAreeVietate.isEmpty()}">
        <h3 style="color: #2c3e50; border-bottom: 2px solid #dc3545; padding-bottom: 0.5rem; margin-bottom: 1rem;">Zone Vietate Configurate</h3>
        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome Zona</th>
                <th>Stato</th>
                <th>Coordinate Delimitate</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="area : ${listaAreeVietate}">
                <td th:text="${area.id}">1</td>
                <td style="font-weight: bold;" th:text="${area.nome}">Area Pedonale Corso Cavour</td>
                <td><span class="badge-vietata" th:text="${area.stato}">VIETATA</span></td>
                <td th:text="${area.descrizione}">Coordinate: ...</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
