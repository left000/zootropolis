<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inserimento Area Vietata - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container {
            max-width: 650px;
            margin: 2.5rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            color: #0f5132;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn-danger-sm {
            background-color: #dc3545;
            color: white;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body style="display: block;">
<div th:replace="~{header :: appHeader}"></div>

<div class="form-container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0; color: #2c3e50;">🚫 Configura Nuova Zona Vietata</h2>
        <!-- annullaOperazione() -->
        <a th:href="@{/amministrazione/aree-vietate/annulla}" class="btn-danger-sm">✖ Annulla</a>
    </div>

    <!-- 6. confermaSalvataggioZona() -->
    <div th:if="${messaggio}" class="alert-success" th:text="${messaggio}">
        Salvataggio completato con successo
    </div>

    <!-- SEQUENZA 4.a: ERRORE VALIDAZIONE -->
    <div th:if="${erroreValidazione}" class="alert-error">
        <strong>⚠️ 4.a.2:</strong> <span th:text="${erroreValidazione}">Dati geografici non validi</span>
        <p style="font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">4.a.3 Modifica i dati geografici inseriti o annulla l'operazione.</p>
    </div>

    <!-- 2. richiediDatiGeografici() / 3. fornisciDatiGeografici(coordinate) -->
    <form th:action="@{/amministrazione/aree-vietate}" method="post">

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Nome/Identificativo Zona:</label>
            <input type="text" name="nomeArea" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${nomeAreaInserito}" placeholder="Es. Area Pedonale Corso Cavour" />
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Coordinate Geografiche Delimitate:</label>
            <textarea name="coordinate" class="form-control" rows="3" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" placeholder="Es. Poligono: [(41.125, 16.870), (41.126, 16.872), (41.123, 16.875)]" required th:text="${coordinateInserite}"></textarea>
        </div>

        <button type="submit" class="btn btn-danger" style="width: 100%; font-weight: bold; padding: 0.7rem; font-size: 0.95rem; background-color: #dc3545; border: none; border-radius: 6px; color: white;">
            Salva ed Imposta Zona come VIETATA
        </button>
    </form>

</div>
</body>
</html>
