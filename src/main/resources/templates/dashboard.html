<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .dashboard-container {
            width: 100%;
            max-width: 900px;
            margin: 2rem auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .service-card {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s;
        }
        .service-card:hover {
            transform: translateY(-5px);
        }
        .service-card h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .service-card p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body style="display: block;">
<div class="dashboard-container">

    <!-- Bar d'intestazione -->
    <div class="header-bar">
        <div>
            <h2>Benvenuto, <span th:text="${account.nome} + ' ' + ${account.cognome}">Utente</span>!</h2>
            <p style="color: #7f8c8d; font-size: 0.9rem;">
                Email: <span th:text="${account.email}"></span>
            </p>
        </div>
        <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>
    </div>

    <!-- Messaggio di benvenuto post-login -->
    <div th:if="${messaggio}" class="alert alert-success" th:text="${messaggio}"></div>

    <!-- Sezione Servizi Zootropolis -->
    <h3 style="margin-bottom: 1rem; color: #2c3e50;">Servizi Disponibili</h3>
    <div class="grid-services">
        <div class="service-card">
            <h3>I Tuoi Biglietti</h3>
            <p>Visualizza o acquista nuovi ingressi per il parco Zootropolis.</p>
            <button class="btn btn-primary" disabled>In arrivo</button>
        </div>
        <div class="service-card">
            <h3>Mappa & Attrazioni</h3>
            <p>Esplora gli itinerari e le aree tematiche disponibili oggi.</p>
            <button class="btn btn-primary" disabled>In arrivo</button>
        </div>
        <div class="service-card">
            <h3>Area Personale</h3>
            <p>Gestisci le credenziali del tuo profilo e le tue preferenze.</p>
            <button class="btn btn-primary" disabled>In arrivo</button>
        </div>
    </div>

</div>
</body>
</html>
