<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prenotazione Confermata - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .confirmation-card {
            max-width: 500px;
            margin: 3rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        .timer-badge {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0d6efd;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body style="display: block;">
<div th:replace="~{header :: appHeader}"></div>

<div class="confirmation-card">
    <span style="font-size: 3rem;">🎉</span>
    <h2 style="color: #2c3e50; margin-top: 0.5rem;">Prenotazione Confermata!</h2>
    <p style="color: #6c757d;">Il veicolo è stato riservato esclusivamente per te.</p>

    <!-- 5. confermaPrenotazione(tempoRimanente) -->
    <div class="timer-badge">
        ⏱️ <span id="timer" th:text="${tempoRimanente} + ':00'">15:00</span>
    </div>
    <p style="font-size: 0.9rem; color: #856404; background-color: #fff3cd; padding: 0.5rem; border-radius: 6px;">
        Raggiungi il mezzo e procedi allo sblocco prima dello scadere del tempo.
    </p>

    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a th:href="@{/utente/dashboard}" class="btn btn-secondary" style="flex: 1; text-decoration: none;">Torna alla Dashboard</a>
        <button class="btn btn-primary" style="flex: 1;" disabled>Sblocca Ora</button>
    </div>
</div>
</body>
</html>
