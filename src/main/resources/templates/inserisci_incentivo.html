<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inserimento Incentivo - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container {
            max-width: 650px;
            margin: 2.5rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            color: #0f5132;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn-danger-sm {
            background-color: #dc3545;
            color: white;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body style="display: block;">
<div th:replace="~{header :: appHeader}"></div>

<div class="form-container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0; color: #2c3e50;">🎁 Nuovo Incentivo Promozionale</h2>
        <!-- annullaOperazione() -->
        <a th:href="@{/amministrazione/incentivi/annulla}" class="btn-danger-sm">✖ Annulla</a>
    </div>

    <!-- 6. confermaSalvataggioIncentivo() -->
    <div th:if="${messaggio}" class="alert-success" th:text="${messaggio}">
        Incentivo salvato con successo
    </div>

    <!-- SEQUENZA 4.a: ERRORE VALIDAZIONE -->
    <div th:if="${erroreValidazione}" class="alert-error">
        <strong>⚠️ 4.a.2:</strong> <span th:text="${erroreValidazione}">Parametri non validi o incongruenti</span>
        <p style="font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">4.a.3 Modifica i parametri inseriti o annulla l'operazione.</p>
    </div>

    <!-- 2. richiediParametriIncentivo() / 3. fornisciParametri(datiIncentivo) -->
    <form th:action="@{/amministrazione/incentivi}" method="post">

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Descrizione Promozione:</label>
            <input type="text" name="descrizione" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${descrizioneInserita}" placeholder="Es. Sconto Primavera Bari" required />
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Sconto Percentuale (%):</label>
            <input type="number" step="0.1" min="1" max="100" name="sconto" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${scontoInserito}" placeholder="Es. 20.0" required />
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Data e Ora Inizio:</label>
            <input type="datetime-local" name="dataInizio" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${dataInizioInserita}" required />
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Data e Ora Fine:</label>
            <input type="datetime-local" name="dataFine" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${dataFineInserita}" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: bold; padding: 0.7rem; font-size: 0.95rem; background-color: #6f42c1; border: none; border-radius: 6px; color: white;">
            Crea ed Attiva Incentivo
        </button>
    </form>

</div>
</body>
</html>
