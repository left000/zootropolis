<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="card">
    <h2>Crea un Account</h2>

    <div th:if="${errore}" class="alert alert-danger" th:text="${errore}"></div>

    <form th:action="@{/utente/registrazione}" method="post" th:object="${registrazioneDTO}">
        <div class="form-group">
            <label>Nome</label>
            <input type="text" th:field="*{nome}" placeholder="Mario" required />
        </div>
        <div class="form-group">
            <label>Cognome</label>
            <input type="text" th:field="*{cognome}" placeholder="Rossi" required />
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="mario.rossi@esempio.com" required />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="••••••••" required />
        </div>
        <div class="form-group">
            <label>Data di Nascita</label>
            <input type="date" th:field="*{dataNascita}" required />
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary">Crea Account</button>
            <a th:href="@{/utente/registrazione/annulla}" class="btn btn-secondary">Annulla</a>
        </div>
    </form>

    <div class="footer-link">
        Hai già un account? <a th:href="@{/login}">Accedi qui</a>
    </div>
</div>
</body>
</html>
