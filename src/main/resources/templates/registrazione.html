<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body style="display: block;">
<div class="card" style="max-width: 480px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
    <h2>Crea un Account</h2>

    <!-- SEQUENZA 4.a.1: informa("Dati non validi o identificativo già in uso") -->
    <div th:if="${errore}" class="alert alert-danger" style="background-color: #f8d7da; color: #721c24; padding: 0.8rem; border-radius: 6px; margin-bottom: 1rem; border: 1px solid #f5c6cb;">
        <strong>⚠️ 4.a.1:</strong> <span th:text="${errore}">Dati non validi o identificativo già in uso</span>
        <p style="font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">4.a.2 Inserisci nuovamente i dati o annulla l'operazione.</p>
    </div>

    <!-- 2. richiediDatiRegistrazione() / 3. fornisciDatiRegistrazione(datiPersonali, credenziali) -->
    <form th:action="@{/utente/registrazione}" method="post" th:object="${registrazioneDTO}">
        <div class="form-group" style="margin-bottom: 0.8rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc;" placeholder="Mario" required />
        </div>

        <div class="form-group" style="margin-bottom: 0.8rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Cognome</label>
            <input type="text" th:field="*{cognome}" class="form-control" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc;" placeholder="Rossi" required />
        </div>

        <div class="form-group" style="margin-bottom: 0.8rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Email</label>
            <input type="email" th:field="*{email}" class="form-control" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc;" placeholder="mario.rossi@esempio.com" required />
        </div>

        <div class="form-group" style="margin-bottom: 0.8rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Password</label>
            <input type="password" th:field="*{password}" class="form-control" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc;" placeholder="••••••••" required />
        </div>

        <div class="form-group" style="margin-bottom: 1.2rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.3rem;">Data di Nascita</label>
            <input type="date" th:field="*{dataNascita}" class="form-control" style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc;" required />
        </div>

        <div class="button-group" style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1; font-weight: bold; padding: 0.6rem;">Crea Account</button>
            <!-- 4.a: annullaOperazione() -->
            <a th:href="@{/utente/registrazione/annulla}" class="btn btn-secondary" style="text-decoration: none; padding: 0.6rem 1rem; background-color: #6c757d; color: white; border-radius: 6px; text-align: center;">Annulla</a>
        </div>
    </form>

    <div class="footer-link" style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        Hai già un account? <a th:href="@{/login}">Accedi qui</a>
    </div>
</div>
</body>
</html>
