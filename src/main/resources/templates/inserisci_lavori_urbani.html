<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inserimento Lavori Urbani - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container {
            max-width: 650px;
            margin: 2.5rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            color: #0f5132;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn-danger-sm {
            background-color: #dc3545;
            color: white;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body style="display: block;">
<div th:replace="~{header :: appHeader}"></div>

<div class="form-container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0; color: #2c3e50;">🚧 Lavori Urbani (Cantieri)</h2>
        <!-- annullaOperazione() -->
        <a th:href="@{/amministrazione/lavori-urbani/annulla}" class="btn-danger-sm">✖ Annulla</a>
    </div>

    <!-- 6. confermaAvvenutoAggiornamento() -->
    <div th:if="${messaggio}" class="alert-success" th:text="${messaggio}">
        Aggiornamento completato con successo
    </div>

    <!-- SEQUENZA 4.a: ERRORE VALIDAZIONE -->
    <div th:if="${erroreValidazione}" class="alert-error">
        <strong>⚠️ 4.a.2:</strong> <span th:text="${erroreValidazione}">Dati non validi</span>
        <p style="font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">4.a.3 Modifica i campi o clicca su Annulla in alto a destra.</p>
    </div>

    <!-- 2. richiediDatiGeograficiETemporali() / 3. fornisciDatiLavori(coordinate, date) -->
    <form th:action="@{/amministrazione/lavori-urbani}" method="post">

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Nome/Identificativo Cantiere:</label>
            <input type="text" name="nomeArea" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${nomeAreaInserito}" placeholder="Es. Cantiere Via Sparano" />
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Coordinate Geografiche (Delimitazione):</label>
            <input type="text" name="coordinate" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${coordinateInserite}" placeholder="Es. Lat 41.12, Lon 16.86 - Raggio 200m" required />
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Periodo Lavori (Date Inizio/Fine):</label>
            <input type="text" name="date" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${dateInserite}" placeholder="Es. Dal 20/09/2026 al 30/10/2026" required />
        </div>

        <button type="submit" class="btn btn-warning" style="width: 100%; font-weight: bold; padding: 0.7rem; font-size: 0.95rem; color: #212529;">
            Registra Cantiere ed Imposta Area VIETATA
        </button>
    </form>

</div>
</body>
</html>
