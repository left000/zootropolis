<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inserimento Lavori Urbani - Zootropolis</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .form-container {
            max-width: 750px;
            margin: 2.5rem auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .alert-error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .alert-success {
            background-color: #d1e7dd;
            border: 1px solid #badbcc;
            color: #0f5132;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn-danger-sm {
            background-color: #dc3545;
            color: white;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .data-table th, .data-table td {
            padding: 0.6rem;
            border-bottom: 1px solid #dee2e6;
            text-align: left;
        }
        .data-table th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        .badge-vietata {
            background: #dc3545;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body style="display: block;">
<div th:replace="~{header :: appHeader}"></div>

<div class="form-container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="margin: 0; color: #2c3e50;">🚧 Lavori Urbani (Cantieri)</h2>
        <a th:href="@{/amministrazione/lavori-urbani/annulla}" class="btn-danger-sm">✖ Annulla</a>
    </div>

    <!-- Messaggio di conferma -->
    <div th:if="${messaggio}" class="alert-success" th:text="${messaggio}">
        Aggiornamento completato con successo
    </div>

    <!-- Gestione Errore Validazione -->
    <div th:if="${erroreValidazione}" class="alert-error">
        <strong>⚠️ Errore:</strong> <span th:text="${erroreValidazione}">Dati non validi</span>
        <p style="font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">Modifica i campi o clicca su Annulla per tornare alla Dashboard.</p>
    </div>

    <!-- Form Inserimento -->
    <form th:action="@{/amministrazione/lavori-urbani}" method="post">

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Nome/Identificativo Cantiere:</label>
            <input type="text" name="nomeArea" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${nomeAreaInserito}" placeholder="Es. Cantiere Via Sparano" />
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Coordinate Geografiche (Delimitazione):</label>
            <input type="text" name="coordinate" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${coordinateInserite}" placeholder="Es. Lat 41.12, Lon 16.86 - Raggio 200m" required />
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="font-weight: bold; display: block; margin-bottom: 0.4rem;">Periodo Lavori (Date Inizio/Fine):</label>
            <input type="text" name="date" class="form-control" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc;" th:value="${dateInserite}" placeholder="Es. Dal 20/09/2026 al 30/10/2026" required />
        </div>

        <button type="submit" class="btn btn-warning" style="width: 100%; font-weight: bold; padding: 0.7rem; font-size: 0.95rem; color: #212529;">
            Registra Cantiere ed Imposta Area VIETATA
        </button>
    </form>

    <!-- Tabella elenco cantieri registrati -->
    <div style="margin-top: 2.5rem;" th:if="${areeRegistrate != null and !areeRegistrate.isEmpty()}">
        <h3 style="color: #2c3e50; border-bottom: 2px solid #ffc107; padding-bottom: 0.5rem; margin-bottom: 1rem;">Cantieri e Lavori Registrati</h3>
        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome Area</th>
                <th>Stato</th>
                <th>Dettagli / Coordinate</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="area : ${areeRegistrate}">
                <td th:text="${area.id}">1</td>
                <td style="font-weight: bold;" th:text="${area.nome}">Cantiere Via Sparano</td>
                <td><span class="badge-vietata" th:text="${area.stato}">VIETATA</span></td>
                <td th:text="${area.descrizione}">Coordinate: ...</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
