<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Zootropolis</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="card">
  <h2>Accedi a Zootropolis</h2>

  <div th:if="${errore}" class="alert alert-danger" th:text="${errore}"></div>
  <div th:if="${messaggio}" class="alert alert-success" th:text="${messaggio}"></div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" placeholder="nome@esempio.com" required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
  </form>

  <div class="footer-link">
    Non hai un account? <a th:href="@{/utente/registrazione}">Registrati qui</a>
  </div>
</div>
</body>
</html>
