spring.application.name=zootropolis

# Credenziali e stringa di connessione a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/zootropolis?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.root=INFO
logging.level.com.zootropolis=DEBUG
logging.file.name=logs/zootropolis.log